# Keeps SHA-pinned GitHub Actions and the pinned eval agent (evals/agent) current.
# Dependabot updates each SHA with its version comment; the cooldown avoids adopting a
# release in its first week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /evals/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
