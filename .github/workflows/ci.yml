# CI for the clean-code-refactor package.
#
# Security posture:
#   - Minimal permissions (contents: read); no secrets are used or required.
#   - Pull requests run the same read-only suite; untrusted PR code never receives credentials.
#   - Actions are pinned to full commit SHAs (version in the trailing comment) and kept
#     current by Dependabot (.github/dependabot.yml). Checkout does not persist credentials.
#   - Tools installed at run time are pinned to exact versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PSSCRIPTANALYZER_VERSION: 1.25.0
  ACTIONLINT_VERSION: 1.7.12
  ZIZMOR_VERSION: 1.30.1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate package (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/validate-skill.ps1
      - name: Validate package (PowerShell 7)
        shell: pwsh
        run: ./scripts/validate-skill.ps1
      - name: Installer behavioral tests (PowerShell)
        shell: pwsh
        run: ./tests/run-tests.ps1 -SkipBash
      - name: Lint PowerShell (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force -Scope CurrentUser
          $findings = @('scripts', 'tests') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($findings) { $findings | Format-Table -AutoSize | Out-String -Width 200; exit 1 }

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell (ShellCheck)
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Bash installer behavioral tests
        run: bash tests/install.sh.tests.sh
      - name: PowerShell suite and validation (PowerShell 7)
        shell: pwsh
        run: ./tests/run-tests.ps1 -SkipBash

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate package (PowerShell 7)
        shell: pwsh
        run: ./scripts/validate-skill.ps1
      - name: Bash installer behavioral tests
        run: bash tests/install.sh.tests.sh

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows (actionlint)
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Audit workflow security (zizmor, offline)
        run: pipx run --spec "zizmor==${ZIZMOR_VERSION}" zizmor --offline --format=github .
