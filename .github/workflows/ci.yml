# CI for the clean-code-refactor package.
#
# Security posture:
#   - Minimal permissions (contents: read); no secrets are used or required.
#   - Pull requests run the same read-only suite; untrusted PR code never receives credentials.
#   - NOTE: before production use, replace the version-tag action references with
#     commit-SHA pins (immutable references) per the repository's supply-chain policy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/validate-skill.ps1
      - name: Validate package (PowerShell 7)
        shell: pwsh
        run: ./scripts/validate-skill.ps1
      - name: Installer behavioral tests (PowerShell)
        shell: pwsh
        run: ./tests/run-tests.ps1 -SkipBash
      - name: Lint PowerShell (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($findings) { $findings | Format-Table; exit 1 }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell (ShellCheck)
        run: shellcheck scripts/install.sh tests/install.sh.tests.sh
      - name: Bash installer behavioral tests
        run: bash tests/install.sh.tests.sh
      - name: Full suite (PowerShell 7 incl. bash suite)
        shell: pwsh
        run: ./tests/run-tests.ps1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package (PowerShell 7)
        shell: pwsh
        run: ./scripts/validate-skill.ps1
      - name: Bash installer behavioral tests
        run: bash tests/install.sh.tests.sh
